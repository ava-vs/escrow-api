name = "escrow-api"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]
account_id = "f9b21de354b82b72fe9d40ea2c9c4577"

# Variables
[vars]
ENVIRONMENT = "production"
JWT_SECRET = "your-jwt-secret-key"
API_KEY = "Escrow-secret-test"

# D1 Database (Free: 5GB storage, 5M reads/day, 100K writes/day)
[[d1_databases]]
binding = "DB"
database_name = "escrow-db"
database_id = "72d04560-075f-4bd6-aeab-f4fbf17525d1"

# KV Namespace for authentication (Free: 100K reads/day, 1K writes/day)
[[kv_namespaces]]
binding = "KV_AUTH"
id = "2870b88185304e4f8af4856c01cf4ee9"